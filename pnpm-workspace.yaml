packages:
  - apps/*
  - packages/*
  - e2e

# Versions shared by several packages. Reference them with "catalog:".
catalog:
  "@types/node": ^22.20.5
  typescript: ^7.0.2
  vitest: ^5.1.0
  zod: ^4.6.7

# What dependencies may do. Everything else is refused.
permissions:
  # These run install scripts.
  esbuild:
    build: true
  workerd:
    build: true
  # These ship agent skills. They are not installed.
  "@tanstack/react-router":
    skills: false
  "@tanstack/router-plugin":
    skills: false
