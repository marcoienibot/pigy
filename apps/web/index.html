<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- What installs pigy as an app. The icons are made by `pnpm icons`.
         iOS takes its icon from the link and not from the manifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The colour of what the browser or the phone draws around the page:
         the background of the app, `--background` in src/styles.css, in
         the theme that is on screen. The manifest has the light one. -->
    <meta name="theme-color" content="#ffffff" data-light="#ffffff" data-dark="#101012" />
    <title>pigy</title>
    <script>
      // Apply the theme before first paint so the page does not flash.
      // src/components/theme-provider.tsx keeps it up to date afterwards.
      // This is the only inline script, which a content security policy
      // has to allow by its hash.
      (() => {
        const theme = localStorage.getItem("pigy-theme");
        const dark =
          theme === "dark" ||
          (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        const color = document.querySelector('meta[name="theme-color"]');
        color.content = dark ? color.dataset.dark : color.dataset.light;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
